name: Release

# Tag a release with the version from package.json, e.g.:
#   npm version minor && git push --follow-tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm trusted publishing + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci --ignore-scripts

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg."
            exit 1
          fi

      - run: npm run build
      - run: npm test
      - run: npm run build:mcpb

      # Trusted publishing (OIDC): npm authenticates this workflow through
      # `id-token: write`, no NPM_TOKEN. It needs npm >= 11.5.1, newer than
      # the npm bundled with Node 22 (npm 12 needs a newer Node 22).
      - run: npm install -g npm@11

      - name: Publish to npm
        run: npm publish --provenance --access public

      # The bundle is attached unsigned; `mcpb sign` needs a code-signing
      # certificate, which we can add here once one is issued.
      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for the release notes." \
            dist/appmixer-mcp-*.mcpb
